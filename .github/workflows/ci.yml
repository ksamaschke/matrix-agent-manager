name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test -race ./...
      - run: go vet ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/matrix-agent-manager
      - run: helm template agent-manager helm/matrix-agent-manager >/tmp/rendered.yaml
      - name: Check rendered chart has no Secret objects or deployment values
        run: |
          ! grep -qE '^kind: Secret$' /tmp/rendered.yaml
          ! grep -qE 'samaschke\.de|vanillacore|auth\.vanillacore\.net|matrix\.home|admin\.matrix' /tmp/rendered.yaml

  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject deployment-specific literals and private material
        run: python3 .github/scripts/source_hygiene.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, helm, source-hygiene]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
