apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: matrixagents.matrix-agent-manager.io
spec:
  group: matrix-agent-manager.io
  scope: Namespaced
  names:
    kind: MatrixAgent
    listKind: MatrixAgentList
    plural: matrixagents
    singular: matrixagent
    shortNames: [mxagent]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Agent, type: string, jsonPath: .spec.agentName}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Generation, type: integer, jsonPath: .status.tokenGeneration}
        - {name: Secret, type: string, jsonPath: .status.secretName}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A Matrix agent account managed by the Matrix Agent Manager. The
            operator creates the account, keeps its token current and writes it
            into spec.secretName in this namespace.
          properties:
            spec:
              type: object
              required: [displayName, secretName]
              properties:
                agentName:
                  type: string
                  description: Matrix localpart; defaults to metadata.name.
                  pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 256
                secretName:
                  type: string
                  description: >-
                    Secret in this namespace receiving access-token, user-id,
                    device-id and homeserver.
                  pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"
                adoptExisting:
                  type: boolean
                  description: >-
                    Take over an account or Secret that already exists without
                    this resource. The current token is kept.
                deletionPolicy:
                  type: string
                  enum: [Retain, Deactivate]
                  default: Retain
                  description: >-
                    Retain keeps the account when the resource is deleted;
                    Deactivate revokes its sessions and deactivates it.
                rotationToken:
                  type: string
                  description: Change this value to rotate the token once.
                restartDeployments:
                  type: array
                  description: >-
                    Deployments in this namespace whose pods are restarted when
                    the token changes.
                  items:
                    type: string
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                matrixUserId: {type: string}
                deviceId: {type: string}
                masUserId: {type: string}
                tokenGeneration: {type: integer}
                restartedGeneration: {type: integer}
                rotationToken: {type: string}
                lastRotationTime: {type: string}
                secretName: {type: string}
