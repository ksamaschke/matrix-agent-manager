apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matrix-agent-manager.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "matrix-agent-manager.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: matrix-agent-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "matrix-agent-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "matrix-agent-manager.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: matrix-agent-manager
    spec:
      serviceAccountName: {{ include "matrix-agent-manager.fullname" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "matrix-agent-manager.fullname" . }}
          env:
            - name: AGENT_MANAGER_MAS_CLIENT_SECRET_FILE
              value: {{ .Values.config.mas.clientSecretFile | quote }}
          volumeMounts:
            - name: mas-client-secret
              mountPath: /var/run/secrets/matrix-agent-manager
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: mas-client-secret
          secret:
            secretName: {{ .Values.secretRefs.masClientSecret.name | quote }}
            items:
              - key: {{ .Values.secretRefs.masClientSecret.key | quote }}
                path: client-secret
